name: Performance Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench-smoke:
    name: Bench Smoke (ubuntu / nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-08-31

      - name: Install OS deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: perf-ubuntu-nightly

      - name: Run benchmark smoke + budgets
        run: |
          ./scripts/bench_smoke.sh

      - name: Run memory/RSS smoke (synthetic workload)
        run: |
          cargo test -p pt-core --test memory_smoke --quiet

      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.sha }}
          path: |
            target/criterion/
          retention-days: 14
