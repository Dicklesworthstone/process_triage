[package]
name = "pt-telemetry"
version = "0.1.0"
edition = "2021"
description = "Process Triage telemetry storage: Arrow schemas and Parquet writer"
license = "MIT"

[dependencies]
# Arrow/Parquet
arrow = { version = "60", features = ["prettyprint", "chrono-tz"] }
parquet = { version = "60", features = ["zstd", "async"] }

# Core dependencies
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
thiserror.workspace = true
tracing = "0.1"
tempfile = "3"

dirs = "5"

# Internal crates
pt-common = { path = "../pt-common" }
pt-redact = { path = "../pt-redact" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"
serde_json.workspace = true  # Re-export for test assertions
